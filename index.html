<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYAH | Discover the Quran</title>
    <link rel="stylesheet" href="css/home.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="app.js"></script>
</head>
<body>
    <nav class="global-nav">
        <div class="logo">AYAH</div>
        
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="pages/discover.html">Discover</a>
            <a href="pages/explore.html">Explore</a>
        </div>
    </nav>
    
    <main>
        
        <div id="smooth-content">

            <!-SECTION ONE: HERO AND INTRODUCTION>
            <section class="scroll-page hero-section">
                
                <div class="large-typography">
                    <h1 class="gsap-reveal-text">Discover the Quran</h1>
                    <h1 class="gsap-reveal-text">,one ayah at a time</h1>
                </div>

                <div class="scroll-prompt gsap-fade-in">
                    <p>Lets begin your journey</p>
                    <div class="scroll-line"></div>
                </div>

            </section>

            <!-SECTION TWO: QURANIC TERMINOLOGY GUIDE>
            <section class="scroll-page terminology-section">

                <div class="term-card" id="term-ayah">
                    <h2 class="large-typograpgy gsap-slide-up">What is an Ayah?</h2>
                    <p class="gsap-fade-in">An <i>Ayah</i> is a single verse within the Quran.</p>
                </div> 
                
                <div class="term-card" id="term-surah">
                    <h2 class="large-typograpgy gsap-slide-up">What is a Surah?</h2>
                    <p class="gsap-fade-in">A <i>Surah</i> is a chapter within the Quran, consisting of multiple Ayahs.</p>
                </div>

            </section>

            <!-SECTION THREE: CALL TO ACTION>
            <section class="scroll-page journey-section">

                <div class="journey-content">
                    <h1 class="large-typography gsap-reveal-text">Ready to Discover more?</h1>
                    <a href="pages/discover.html" class="primary-btn gsap-fade-in">Begin your Journey</a>
                </div>

            </section>
        
        </div>

    </main>

    
</body>
</html>
