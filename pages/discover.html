<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover | AYAH</title>
    <link rel="stylesheet" href="../css/discover.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="../app.js"></script>
</head>
<body>
    <nav class="global-nav">
        <div class="logo"><a href="../index.html">AYAH</a></div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="discover.html" class="active">Discover</a>
            <a href="explore.html">Explore</a>
        </div>
    </nav>

    <main class="discovery-container">

        <!-LOADING STATE->
        <div id="api-loading" class="state-container">
            <div class="spinner"></div>
            <p>Retrieving a verse...</p>
        </div>

        <!-SUCCESS STATE (HIDDEN BY DEFAULT UNTIL API RESPONDS)->
        <div id="api-success" class="state-container hidden">
            <div class="verse-reference">
                <span id="surah-name-en"></span> | Verse <span id="ayah-number"></span>            
            </div>

            <div class="verse-content">
                <p id="arabic-text" class="arabic-typography" dir="rtl"></p>
                <p id="english-translation" class="english-typography"></p>
            </div>

            <div class="action-bar">
                <button id="btn-listen" class="secondary-btn" disabled>Listen</button>
                <button id="btn-next-ayah" class="primary-btn">Discover Another</button>
                <a href="explore.html" id="link-explore" class="text-link">Explore Context</a>
            </div>

            <!-ERROR STATE (HIDDEN BY DEFAULT UNTIL API RESPONDS)->
            <div id="api-error" class="state-container hidden">
                <p>Oops! Something went wrong while fetching the verse.</p>
                <button id="btn-retry" class="secondary-btn">Try Again</button>
            </div>

        </div>
    </main>
</body>
</html>
